name: Build unsigned desktop apps

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }} installer
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            artifact: macos
          - name: Windows
            os: windows-latest
            artifact: windows

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
            desktop/package-lock.json

      - name: Install server dependencies
        run: npm ci --prefix server

      - name: Install web dependencies
        run: npm ci --prefix web

      - name: Install desktop dependencies
        run: npm ci --prefix desktop

      - name: Build unsigned installers
        run: npm run make:desktop

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: yunn-workbench-${{ matrix.artifact }}-${{ github.ref_name }}
          path: desktop/out/make/**/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub pre-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: yunn-workbench-*-${{ github.ref_name }}
          path: downloaded-artifacts
          merge-multiple: true

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release-assets

          mac_dmg="$(find downloaded-artifacts -type f -name '*.dmg' -print -quit)"
          mac_zip="$(find downloaded-artifacts -type f -name '*.zip' -print -quit)"
          windows_setup="$(find downloaded-artifacts -type f -name '*Setup.exe' -print -quit)"

          test -n "$mac_dmg"
          test -n "$mac_zip"
          test -n "$windows_setup"

          cp "$mac_dmg" "release-assets/Yunn-Workbench-${version}-macOS-arm64.dmg"
          cp "$mac_zip" "release-assets/Yunn-Workbench-${version}-macOS-arm64.zip"
          cp "$windows_setup" "release-assets/Yunn-Workbench-${version}-Windows-x64-Setup.exe"

          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Create or update pre-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$tag" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$tag" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Yunn Workbench $tag" \
              --generate-notes \
              --prerelease \
              --latest=false
          fi
